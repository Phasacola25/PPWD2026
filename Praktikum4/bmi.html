<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator BMI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: #373642;
        }

        .kalkulator {
            background: grey;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 1);
            text-align: center;
        }

        input {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
            width: 80%;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            font-size: 16px;
            background: #0c10eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #541b60;
        }

        .hasil {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="kalkulator">

        <h2>Kalkulator BMI</h2>

        <input
            type="number"
            id="berat"
            placeholder="Masukkan Berat (kg)"
        >
        <br>

        <input
            type="number"
            id="tinggi"
            placeholder="Masukkan Tinggi (cm)"
        >
        <br><br>

        <button onclick="hitungBMI()">Hitung BMI</button>

        <button onclick="reset()" style="background: #e74c3c;">
            Reset
        </button>

        <div class="hasil">
            Hasil:
            <span id="hasilBMI"></span>
        </div>

    </div>

    <script>

        function hitungBMI() {

            // Mengambil nilai dari input
            let berat = parseFloat(document.getElementById('berat').value);
            let tinggi = parseFloat(document.getElementById('tinggi').value);

            // Validasi input
            if (isNaN(berat) || isNaN(tinggi)) {
                document.getElementById('hasilBMI').innerHTML =
                    'Masukkan berat dan tinggi terlebih dahulu!';
                return;
            }

            // Mengubah tinggi dari cm menjadi meter
            let tinggiMeter = tinggi / 100;

            // Menghitung BMI
            let bmi = berat / (tinggiMeter * tinggiMeter);

            // Menentukan status berat badan
            let status;

            if (bmi < 18.5) {
                status = 'Kurus';
            } else if (bmi < 25) {
                status = 'Normal';
            } else if (bmi < 30) {
                status = 'Gemuk';
            } else {
                status = 'Obesitas';
            }

            // Menampilkan hasil
            document.getElementById('hasilBMI').innerHTML =
                '<br>BMI: ' + bmi.toFixed(2) +
                '<br>Status: ' + status;
        }

        function reset() {
            document.getElementById('berat').value = '';
            document.getElementById('tinggi').value = '';
            document.getElementById('hasilBMI').innerHTML = '';
        }

    </script>

</body>
</html>
